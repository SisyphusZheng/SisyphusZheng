name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Build
        run: deno run -A --config deno.json scripts/build.ts
